# Codecov configuration for the upload in .github/workflows/coverage.yml.
# Reference: https://docs.codecov.com/docs/codecov-yaml

codecov:
  # coverage.yml is the only uploader, so its report should neither be withheld
  # because another workflow's check failed nor wait for those checks to finish.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

# No path fixes are needed. coverlet names each file relative to the report's
# <source>, which is the absolute path of src/ in the checkout, and Codecov
# resolves those relative names against the repository's own file list; every
# path in a real report resolves that way. Nothing in the build rewrites the
# paths the PDBs carry either: the projects set neither ContinuousIntegrationBuild
# nor PathMap, and reference no SourceLink package.

# Both reports go up in one upload, so there are no flags. The components split
# the figure by shipped assembly instead: the two extensions are a small part of
# the code, so a change in one of them would barely move the project figure on
# its own.
component_management:
  individual_components:
    - component_id: driver
      name: Driver
      paths:
        - src/Cassandra/**
    - component_id: appmetrics
      name: App Metrics extension
      paths:
        - src/Extensions/Cassandra.AppMetrics/**
    - component_id: opentelemetry
      name: OpenTelemetry extension
      paths:
        - src/Extensions/Cassandra.OpenTelemetry/**

# Codecov shows components only where it is told to: here, as a table in the
# pull request comment. They get no statuses of their own; the informational
# ones below cover all three assemblies together.
comment:
  layout: "header, diff, components, files"

coverage:
  status:
    # Informational: report the delta, never fail a pull request on it. The
    # integration suite runs against a live ScyllaDB cluster, so which lines it
    # reaches depends on cluster timing as well as on the diff.
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
