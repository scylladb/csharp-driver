omit-from-release-notes:
  - changed-files:
      - all-globs-to-all-files:
          # Every filename must match this one brace union.
          # Add support paths inside the union, never as another glob entry.
          # Publishing, packaging, SDK and runtime inputs stay visible.
          - '{docs/**,proposals/**,ci/**,src/Cassandra.Tests/**,src/Cassandra.IntegrationTests/**,build/tests/**,.github/tests/**,.github/workflows/docs-pages.yml,.github/workflows/docs-pr.yaml,.github/workflows/docs-pr-report.yaml,.github/workflows/docs-dependencies.yaml,.github/workflows/main.yml,.github/workflows/package-validator-tests.yml,.github/workflows/call_jira_sync.yml,.github/workflows/label-release-notes.yml,.github/labeler.yml,.github/release.yml,.github/dependabot.yml,README.md,CONTRIBUTING.md,MAINTENANCE.md,AGENTS.md,.nav,doxyfile,.gitattributes,.gitignore,renovate.json,examples/README.MD,examples/OpenTelemetry/DistributedTracing/README.md,src/Cassandra/Compression/Snappy/README.md,tools/JUnitXml.xslt,tools/nunit3-junit.xslt,tools/nunit3-xunit.xslt,tools/trx-to-junit.xslt}'
