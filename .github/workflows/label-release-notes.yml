name: Label support-only release changes

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to classify, including merged PRs
        required: true
        type: number

permissions: {}

concurrency:
  group: release-notes-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Check pull request files
        id: target
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const raw = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(raw) || !Number.isSafeInteger(Number(raw))) {
              throw new Error('Expected a canonical positive safe PR number');
            }
            const number = Number(raw);
            // A trusted PR event allows cleanup even if the API lookup fails.
            if (context.eventName === 'pull_request_target' &&
                context.payload?.pull_request?.number === number) {
              core.setOutput('confirmed', 'true');
            }
            const params = {...context.repo, pull_number: number};
            const {data: pr} = await github.rest.pulls.get(params);
            if (pr.number !== number) throw new Error('Target is not the requested pull request');
            core.setOutput('confirmed', 'true');
            const files = await github.paginate(github.rest.pulls.listFiles, {...params, per_page: 100});
            if (!Number.isSafeInteger(pr.changed_files) || pr.changed_files <= 0 ||
                files.length !== pr.changed_files) {
              throw new Error('Changed-file listing does not match a positive expected count');
            }
            // Keep every rename visible rather than duplicating labeler's glob policy.
            const renamed = files.some(file => file.status === 'renamed' || file.previous_filename);
            core.setOutput('eligible', String(!renamed));
            core.info(`PR #${number}: ${files.length} files; contains rename=${renamed}`);
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        id: labeler
        if: success() && steps.target.outputs.eligible == 'true'
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
          pr-number: ${{ env.PR_NUMBER }}
      - name: Remove unverified omission label
        if: always() && steps.target.outputs.confirmed == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          LABELER_OUTCOME: ${{ steps.labeler.outcome }}
          LABELER_ELIGIBLE: ${{ steps.target.outputs.eligible }}
          LABELER_OUTPUTS: ${{ toJSON(steps.labeler.outputs) }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            if (process.env.LABELER_OUTCOME === 'success' && process.env.LABELER_ELIGIBLE === 'true') {
              // Completion emits this key even when the resulting label list is empty.
              if (Object.hasOwn(JSON.parse(process.env.LABELER_OUTPUTS), 'all-labels')) return;
              core.setFailed('Labeler did not report completed classification');
            }
            try {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: Number(process.env.PR_NUMBER), name: 'omit-from-release-notes'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
