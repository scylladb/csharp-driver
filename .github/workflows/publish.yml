name: Release NuGet packages

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part package version without the v prefix
        type: string
        required: true
      target_commit:
        description: Full SHA at the branch tip; production creates a signed release commit
        type: string
        required: true
      dry_run:
        description: Sign, pack, validate, and retain artifacts without publishing
        type: boolean
        required: true
        default: true
      resume_partial_publication:
        description: Resume the exact tagged commit after a partial NuGet publication
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      target_commit:
        type: string
        required: true
      dry_run:
        type: boolean
        required: true
      resume_partial_publication:
        type: boolean
        required: true

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      branch: ${{ steps.gate.outputs.branch }}
      tag: ${{ steps.gate.outputs.tag }}
      already_signed: ${{ steps.gate.outputs.already_signed }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Validate release inputs and milestone
        id: gate
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY: ${{ inputs.resume_partial_publication }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          common=(--repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION"
            --target-commit "$TARGET_COMMIT" --workflow-ref "$WORKFLOW_REF"
            --workflow-sha "$WORKFLOW_SHA" --github-output "$GITHUB_OUTPUT")
          if [[ "$DRY_RUN" == true && "$RECOVERY" == true ]]; then
            echo 'Dry run cannot resume partial publication' >&2
            exit 1
          fi
          if [[ "$DRY_RUN" == true ]]; then
            python3 build/release-gate.py preflight "${common[@]}" --allow-blockers
          elif [[ "$RECOVERY" == true ]]; then
            python3 build/release-gate.py preflight "${common[@]}" --recovery
          elif python3 build/release-gate.py verify-release-commit \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
            --target-commit "$TARGET_COMMIT" >/dev/null 2>&1; then
            python3 build/release-gate.py preflight "${common[@]}" --skip-ci
            echo 'already_signed=true' >> "$GITHUB_OUTPUT"
          else
            python3 build/release-gate.py prepare "${common[@]}" --require-no-blockers
          fi

  prepare-target:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      target_commit: ${{ steps.target.outputs.target_commit }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Checkout exact release source
        if: ${{ !inputs.dry_run && !inputs.resume_partial_publication && needs.preflight.outputs.already_signed != 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.target_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check publisher signing credentials without publishing
        if: ${{ inputs.dry_run }}
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          [[ -n "$RELEASE_BOT_TOKEN" && -n "$RELEASE_GPG_PRIVATE_KEY" ]]
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf -- "${GNUPGHOME:?}"' EXIT
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys \
            71A6D22711CDB7C2446D21CFBF4BF97A8D4DF1AA |
            grep -Fq 'fpr:::::::::71A6D22711CDB7C2446D21CFBF4BF97A8D4DF1AA:'

      - name: Create signed release commit and await exact CI
        if: ${{ !inputs.dry_run && !inputs.resume_partial_publication && needs.preflight.outputs.already_signed != 'true' }}
        id: signed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_BRANCH: ${{ needs.preflight.outputs.branch }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          GATE_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          [[ -n "$RELEASE_BOT_TOKEN" && -n "$RELEASE_GPG_PRIVATE_KEY" ]]
          python3 build/release-gate.py verify-source \
            --source source --version "$RELEASE_VERSION" \
            --branch "$RELEASE_BRANCH" --target-commit "$TARGET_COMMIT"
          fingerprint=71A6D22711CDB7C2446D21CFBF4BF97A8D4DF1AA
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf -- "${GNUPGHOME:?}"' EXIT
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys "$fingerprint" |
            grep -Fq "fpr:::::::::$fingerprint:"
          cd source
          git config user.name 'ScyllaDB Publisher'
          git config user.email 'publish.code@scylladb.com'
          git config user.signingkey "$fingerprint"
          printf 'v%s\n' "$RELEASE_VERSION" > build/release-version.txt
          git add build/release-version.txt
          [[ "$(git diff --cached --name-only)" == 'build/release-version.txt' ]]
          git -c commit.gpgsign=true commit -m "Release v$RELEASE_VERSION"
          git verify-commit --raw HEAD > "$RUNNER_TEMP/release-signature-status" 2>&1
          grep -Fq "[GNUPG:] VALIDSIG $fingerprint " "$RUNNER_TEMP/release-signature-status"
          [[ "$(git diff --name-only "$TARGET_COMMIT" HEAD)" == 'build/release-version.txt' ]]
          current=$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)
          [[ "$current" == "$TARGET_COMMIT" ]]
          GITHUB_TOKEN="$GATE_TOKEN" python3 ../build/release-gate.py prepare \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
            --target-commit "$TARGET_COMMIT" \
            --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA" \
            --require-no-blockers
          gh auth setup-git -h github.com
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          release_commit=$(git rev-parse HEAD)
          echo "target_commit=$release_commit" >> "$GITHUB_OUTPUT"
          verified=false
          for attempt in {1..20}; do
            if GITHUB_TOKEN="$RELEASE_BOT_TOKEN" python3 ../build/release-gate.py \
              verify-release-commit --repository "$GITHUB_REPOSITORY" \
              --version "$RELEASE_VERSION" --target-commit "$release_commit" \
              >/dev/null 2>&1; then
              verified=true
              break
            fi
            sleep 3
          done
          if [[ "$verified" != true ]]; then
            GITHUB_TOKEN="$RELEASE_BOT_TOKEN" python3 ../build/release-gate.py \
              verify-release-commit --repository "$GITHUB_REPOSITORY" \
              --version "$RELEASE_VERSION" --target-commit "$release_commit"
            exit 1
          fi
          GITHUB_TOKEN="$RELEASE_BOT_TOKEN" python3 ../build/release-gate.py \
            wait-ci --repository "$GITHUB_REPOSITORY" \
            --branch "$RELEASE_BRANCH" --target-commit "$release_commit"

      - name: Wait for CI on an existing signed release commit
        if: ${{ !inputs.dry_run && !inputs.resume_partial_publication && needs.preflight.outputs.already_signed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.preflight.outputs.branch }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          python3 build/release-gate.py wait-ci \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$RELEASE_BRANCH" --target-commit "$TARGET_COMMIT"

      - name: Select exact validation target
        id: target
        env:
          SIGNED_COMMIT: ${{ steps.signed.outputs.target_commit }}
          INPUT_COMMIT: ${{ inputs.target_commit }}
        run: echo "target_commit=${SIGNED_COMMIT:-$INPUT_COMMIT}" >> "$GITHUB_OUTPUT"

  pre-release-integration:
    needs: prepare-target
    uses: scylladb/csharp-driver-matrix/.github/workflows/driver-integration-matrix.yml@master
    with:
      driver_ref: ${{ needs.prepare-target.outputs.target_commit }}
      driver_version: ${{ inputs.version }}

  docs-check:
    needs: prepare-target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare-target.outputs.target_commit }}
          persist-credentials: false

      - name: Checkout current docs site tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: master
          path: site
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up docs environment
        run: make -C docs setupenv

      - name: Build API docs
        run: ./docs/_utils/docfx.sh

      - name: Check docs build
        run: make -C docs test

      - name: Set up docs site .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: site/global.json

      - name: Stage the candidate tag in the docs checkout
        env:
          RELEASE_TAG: v${{ inputs.version }}
          TARGET_COMMIT: ${{ needs.prepare-target.outputs.target_commit }}
        run: |
          git -C site fetch --no-tags origin "$TARGET_COMMIT"
          existing=$(git -C site rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null || true)
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$TARGET_COMMIT" ]]
          else
            git -C site tag "$RELEASE_TAG" "$TARGET_COMMIT"
          fi

      - name: Build release docs site
        run: |
          make -C site/docs setupenv
          make -C site/docs multiversion
          make -C site/docs redirects
          test -f site/docs/_build/dirhtml/stable/index.html

      - name: Package checked docs site
        run: |
          tar --dereference --hard-dereference \
            --directory site/docs/_build/dirhtml/ \
            -cf "$RUNNER_TEMP/artifact.tar" .

      - name: Retain checked docs site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [preflight, prepare-target]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Checkout exact release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare-target.outputs.target_commit }}
          path: source
          persist-credentials: false

      - name: Verify exact source and package versions
        env:
          RELEASE_BRANCH: ${{ needs.preflight.outputs.branch }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ needs.prepare-target.outputs.target_commit }}
        run: |
          python3 build/release-gate.py verify-source \
            --source source \
            --version "$RELEASE_VERSION" \
            --branch "$RELEASE_BRANCH" \
            --target-commit "$TARGET_COMMIT"

      - name: Setup target .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: source/global.json

      - name: Sign and pack all release projects
        env:
          SNK_FILE: ${{ secrets.SNK_KEY }}
        run: |
          make -C source .use-production-snk
          rm -rf source/nupkgs
          projects=(
            source/src/Cassandra/Cassandra.csproj
            source/src/Extensions/Cassandra.AppMetrics/Cassandra.AppMetrics.csproj
            source/src/Extensions/Cassandra.OpenTelemetry/Cassandra.OpenTelemetry.csproj
          )
          for project in "${projects[@]}"; do
            dotnet restore "$project"
            dotnet build "$project" --configuration Release --no-restore --maxcpucount:1
            dotnet pack "$project" --configuration Release --no-build --output source/nupkgs
          done

      - name: Verify complete package set
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 build/release-gate.py verify-packages \
            --package-directory source/nupkgs \
            --version "$RELEASE_VERSION"

      - name: Run target-specific package validation
        run: |
          if [[ ! -f source/build/validate-packages.py ]]; then
            echo "Target branch has no package validator; complete its artifact-validation blocker first"
            exit 1
          fi
          (
            cd source
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
              -s build/tests -p 'test_*.py' -v
            python3 build/validate-packages.py --package-directory ./nupkgs
          )

      - name: Record package hashes
        run: (cd source/nupkgs && sha256sum *.nupkg | tee SHA256SUMS)

      - name: Retain validated packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ needs.preflight.outputs.tag }}-${{ needs.prepare-target.outputs.target_commit }}
          path: |
            source/nupkgs/*.nupkg
            source/nupkgs/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [preflight, prepare-target, pre-release-integration, docs-check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Checkout signed release commit for tag creation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare-target.outputs.target_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Download validated packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ needs.preflight.outputs.tag }}-${{ needs.prepare-target.outputs.target_commit }}
          path: nupkgs

      - name: Reverify downloaded package set
        id: packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          (cd nupkgs && sha256sum --check SHA256SUMS)
          python3 build/release-gate.py verify-packages \
            --package-directory nupkgs \
            --version "$RELEASE_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Recheck gate and create immutable tag
        env:
          GATE_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RECOVERY: ${{ inputs.resume_partial_publication }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ needs.prepare-target.outputs.target_commit }}
        run: |
          options=()
          if [[ "$RECOVERY" == true ]]; then
            options+=(--recovery)
          fi
          GITHUB_TOKEN="$GATE_TOKEN" python3 build/release-gate.py gate \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
            --target-commit "$TARGET_COMMIT" "${options[@]}"
          tag="v$RELEASE_VERSION"
          if [[ "$RECOVERY" != true ]]; then
            [[ -n "$GH_TOKEN" && -n "$RELEASE_GPG_PRIVATE_KEY" ]]
            remote_tag=$(git -C source ls-remote origin "refs/tags/$tag")
            [[ -z "$remote_tag" ]]
            fingerprint=71A6D22711CDB7C2446D21CFBF4BF97A8D4DF1AA
            export GNUPGHOME
            GNUPGHOME=$(mktemp -d)
            chmod 700 "$GNUPGHOME"
            trap 'rm -rf -- "${GNUPGHOME:?}"' EXIT
            printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --with-colons --list-secret-keys "$fingerprint" |
              grep -Fq "fpr:::::::::$fingerprint:"
            git -C source config user.name 'ScyllaDB Publisher'
            git -C source config user.email 'publish.code@scylladb.com'
            git -C source config user.signingkey "$fingerprint"
            git -C source tag -s "$tag" -m "Release $tag" "$TARGET_COMMIT"
            git -C source verify-tag --raw "$tag" > "$RUNNER_TEMP/tag-signature-status" 2>&1
            grep -Fq "[GNUPG:] VALIDSIG $fingerprint " "$RUNNER_TEMP/tag-signature-status"
            [[ "$(git -C source rev-parse "$tag^{commit}")" == "$TARGET_COMMIT" ]]
            gh auth setup-git -h github.com
            git -C source push origin "refs/tags/$tag"
          fi
          verified=false
          for attempt in {1..20}; do
            if GITHUB_TOKEN="$GATE_TOKEN" python3 build/release-gate.py ensure-tag \
              --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
              --target-commit "$TARGET_COMMIT" >/dev/null 2>&1; then
              verified=true
              break
            fi
            sleep 3
          done
          if [[ "$verified" != true ]]; then
            GITHUB_TOKEN="$GATE_TOKEN" python3 build/release-gate.py ensure-tag \
              --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
              --target-commit "$TARGET_COMMIT"
            exit 1
          fi

      - name: Get temporary NuGet key for core package
        id: nuget_login_core
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: scylladb.publish.code

      - name: Gate and publish core package
        env:
          GATE_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget_login_core.outputs.NUGET_API_KEY }}
          PACKAGE_ID: ScyllaDBCSharpDriver
          PACKAGE_PATH: ${{ steps.packages.outputs.core }}
          RECOVERY: ${{ inputs.resume_partial_publication }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ needs.prepare-target.outputs.target_commit }}
        run: bash build/publish-release-package.sh

      - name: Get temporary NuGet key for AppMetrics package
        id: nuget_login_appmetrics
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: scylladb.publish.code

      - name: Gate and publish AppMetrics package
        env:
          GATE_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget_login_appmetrics.outputs.NUGET_API_KEY }}
          PACKAGE_ID: ScyllaDBCSharpDriver.AppMetrics
          PACKAGE_PATH: ${{ steps.packages.outputs.appmetrics }}
          RECOVERY: ${{ inputs.resume_partial_publication }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ needs.prepare-target.outputs.target_commit }}
        run: bash build/publish-release-package.sh

      - name: Get temporary NuGet key for OpenTelemetry package
        id: nuget_login_opentelemetry
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: scylladb.publish.code

      - name: Gate and publish OpenTelemetry package
        env:
          GATE_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget_login_opentelemetry.outputs.NUGET_API_KEY }}
          PACKAGE_ID: ScyllaDBCSharpDriver.OpenTelemetry
          PACKAGE_PATH: ${{ steps.packages.outputs.opentelemetry }}
          RECOVERY: ${{ inputs.resume_partial_publication }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ needs.prepare-target.outputs.target_commit }}
        run: bash build/publish-release-package.sh

      - name: Gate and create GitHub Release
        env:
          GATE_TOKEN: ${{ github.token }}
          RECOVERY: ${{ inputs.resume_partial_publication }}
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ needs.prepare-target.outputs.target_commit }}
        run: |
          options=()
          if [[ "$RECOVERY" == "true" ]]; then
            options+=(--recovery)
          fi
          GITHUB_TOKEN="$GATE_TOKEN" python3 build/release-gate.py gate \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
            --target-commit "$TARGET_COMMIT" "${options[@]}"
          GITHUB_TOKEN="$RELEASE_TOKEN" python3 build/release-gate.py ensure-release \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
            --target-commit "$TARGET_COMMIT" \
            "${options[@]}"

  publish-docs:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked docs site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
