name: Publish NuGet Package

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*.*'  # Trigger only on version tags like v1.2.3.4
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Publish particular tag"
        type: string
        required: false
        default: "master"
      dry-run:
        description: "Publish to a dry-run package"
        type: boolean
        required: true
        default: true
      skip-duplicate:
        description: "Skip publishing if the package already exists"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ inputs.target_tag || github.ref }}
        persist-credentials: false

    - name: Checkout SDK configuration
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.event.repository.default_branch }}
        sparse-checkout: global.json
        sparse-checkout-cone-mode: false
        path: .sdk-config
        persist-credentials: false

    - name: Add SDK configuration to legacy checkout
      run: |
        if [[ ! -f global.json ]]; then
          cp .sdk-config/global.json global.json
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        global-json-file: global.json

    - name: Publish to NuGet (Dry Run)
      if: ${{ inputs.dry-run == true }}
      env:
        SKIP_DUPLICATE: ${{ inputs.skip-duplicate }}
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        SNK_FILE: ${{ secrets.SNK_KEY }}
      run: make publish-nuget-dry-run

    - name: Publish to NuGet (Production)
      if: ${{ inputs.dry-run == false }}
      env:
        SKIP_DUPLICATE: ${{ inputs.skip-duplicate }}
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        SNK_FILE: ${{ secrets.SNK_KEY }}
      run: make publish-nuget
