name: Prepare signed release commit

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part 3.22 package version without the v prefix
        type: string
        required: true
      target_commit:
        description: Full SHA at the protected branch-3.22 tip before the marker
        type: string
        required: true

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  prepare:
    uses: scylladb/csharp-driver/.github/workflows/prepare-release.yml@master
    with:
      version: ${{ inputs.version }}
      target_commit: ${{ inputs.target_commit }}
    secrets: inherit
