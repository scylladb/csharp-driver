name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - .github/workflows/docs-pages.yml
      - .github/workflows/docs-pr.yml
      - .gitignore
      - .gitattributes
      - "**/*.md"
      # Only renovate's own config. global.json is the SDK compatibility pin
      # (see AGENTS.md), so changes to it must still run CI.
      - renovate.json
      - NOTICE
      - doxyfile
      - .nav
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - .github/workflows/docs-pages.yml
      - .github/workflows/docs-pr.yml
      - .gitignore
      - .gitattributes
      - "**/*.md"
      # Only renovate's own config. global.json is the SDK compatibility pin
      # (see AGENTS.md), so changes to it must still run CI.
      - renovate.json
      - NOTICE
      - doxyfile
      - .nav

# Cancel in-flight runs for the same pull request, so a new push does not wait
# behind the previous run's build and cluster jobs. Pull requests share one
# stable ref, so a new push cancels the old run; non-PR runs (master push) are
# keyed by SHA instead and are never cancelled, so an intermediate master build
# cannot be dropped by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast gate: formatting only. The cluster jobs below consume no artifact from
  # here, so depending on this instead of the full unit suite and examples build
  # keeps a short critical path while still failing fast on an unlinted tree.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Run dotnet format (checks formatting)
        run: make check

  release-tool-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Test release tooling
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s build/tests -p 'test_*.py' -v

  # Run the net10 unit suite once here instead of repeating it in each
  # integration matrix leg.
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run unit tests
        run: TARGET_FRAMEWORK=net10.0 make test-unit

  build-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build examples
        run: make build-examples

  integration-tests:
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - scylla-version: LTS-LATEST
            target-framework: net10.0
          - scylla-version: LTS-PRIOR
            target-framework: net10.0
          - scylla-version: LATEST
            target-framework: net10.0
          - scylla-version: PRIOR
            target-framework: net10.0
      fail-fast: false

    env:
      TARGET_FRAMEWORK: ${{ matrix.target-framework }}
      # Install the CCM pip package into ~/.local (not the toolcache Python,
      # which is not cached) so the "Cache CCM install" entry below can restore
      # it and the Makefile's .prepare-scylla-ccm guard can actually skip the
      # from-git reinstall. ~/.local/bin is put on PATH right after setup-python.
      PIP_USER: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up JDK 8
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: 8
          distribution: 'temurin'

      - name: Setup Python 3
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Put user-installed Python scripts on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Split caches, each with a restore-key, so an edit to one concern (e.g.
      # the CCM version in the Makefile) falls back to the previous revision of
      # that cache instead of re-downloading pip, CCM and NuGet together. The
      # CCM install stamps make the Makefile's `.prepare-scylla-ccm` guard work:
      # without them it reinstalled CCM from git on every job. The CCM key is
      # scoped to the Python version because the cached `ccm` console script's
      # shebang points at the toolcache interpreter, so a patch bump must miss.
      # (With PIP_USER=1, ccm lands in ~/.local, not the interpreter's own bin.)
      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache CCM install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local
            ~/.ccm/ccm-type
            ~/.ccm/ccm-version
          key: ccm-install-scylla-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ccm-install-scylla-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Pinned prebuilt binary instead of cloning and compiling get-version in
      # every matrix leg (which also pulled the whole Go toolchain).
      - name: Install get-version CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo /tmp/get-version.zip https://github.com/scylladb-actions/get-version/releases/download/v0.4.5/get-version_0.4.5_linux_amd64v3.zip
          unzip -o /tmp/get-version.zip get-version -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Get scylla version
        id: scylla-version
        run: |
          scylla_version_input="${{ matrix.scylla-version }}"
          release_version_re='^([0-9]+\.[0-9]+\.[0-9]+|[0-9]+\.[0-9]+(\.[0-9]+)?[-~.](alpha|beta|rc)[0-9]+)(:debug)?$'

          if [[ "$scylla_version_input" == "LTS-LATEST" ]]; then
            scylla_version="release:$(get-version --source dockerhub-imagetag --repo scylladb/scylla -filters "^[0-9]{4}$.^[0-9]+$.^[0-9]+$ and LAST.1.LAST" | tr -d '\"')"
          elif [[ "$scylla_version_input" == "LTS-PRIOR" ]]; then
            scylla_version="release:$(get-version --source dockerhub-imagetag --repo scylladb/scylla -filters "^[0-9]{4}$.^[0-9]+$.^[0-9]+$ and LAST-1.1.LAST" | tr -d '\"')"
          elif [[ "$scylla_version_input" == "LATEST" ]]; then
            scylla_version="release:$(get-version --source dockerhub-imagetag --repo scylladb/scylla -filters "^[0-9]{4}$.^[0-9]+$.^[0-9]+$ and LAST.LAST.LAST" | tr -d '\"')"
          elif [[ "$scylla_version_input" == "PRIOR" ]]; then
            resolved_version=$(get-version --source dockerhub-imagetag --repo scylladb/scylla -filters "^[0-9]{4}$.^[0-9]+$.^[0-9]+$ and LAST.LAST.LAST-1" | tr -d '\"')
            if [[ -z "$resolved_version" ]]; then
              echo "No PRIOR version found, skipping test"
              echo "SKIP_TEST=true" >> $GITHUB_ENV
            else
              scylla_version="release:$resolved_version"
            fi
          elif [[ "$scylla_version_input" =~ $release_version_re ]]; then
            scylla_version="release:$scylla_version_input"
          elif [[ "$scylla_version_input" == release:* ]]; then
            scylla_version="$scylla_version_input"
          elif [[ "$scylla_version_input" == unstable/*:* || "$scylla_version_input" == hotfix/*:* ]]; then
            scylla_version="$scylla_version_input"
          else
            echo "Unknown scylla version name '$scylla_version_input'"
            exit 1
          fi

          if [[ "$scylla_version" == release:* ]] && [[ ! "${scylla_version#release:}" =~ $release_version_re ]]; then
            echo "ScyllaDB release '$scylla_version' does not name one build"
            echo "Use release:MAJOR.MINOR.PATCH or an exact pre-release build; partial releases make CCM query S3 repeatedly"
            exit 1
          fi

          if [[ -n "$scylla_version" ]]; then
            echo "value=$scylla_version" >> $GITHUB_OUTPUT
            echo "SCYLLA_VERSION=$scylla_version" >> $GITHUB_ENV
          fi

      # CCM writes the downloaded relocatable into ~/.ccm/scylla-repository, keyed
      # by the resolved version, so a version bump still misses and re-downloads.
      - name: Pull ScyllaDB image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.SKIP_TEST != 'true' && steps.scylla-version.outputs.value != ''
        id: scylla-cache
        with:
          path: ~/.ccm/scylla-repository
          key: ccm-scylla-${{ runner.os }}-${{ steps.scylla-version.outputs.value }}

      - name: Run integration tests on Scylla
        if: env.SKIP_TEST != 'true'
        run: make test-integration-scylla

      - name: Save ScyllaDB image into the cache
        if: env.SKIP_TEST != 'true' && steps.scylla-version.outputs.value != '' && steps.scylla-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccm/scylla-repository
          key: ccm-scylla-${{ runner.os }}-${{ steps.scylla-version.outputs.value }}

  cassandra-integration-tests:
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CASSANDRA_VERSION: 4.0.21
      TARGET_FRAMEWORK: net10.0
      PIP_USER: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Checkout Cassandra CCM SSL fixtures
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: apache/cassandra-ccm
          ref: d3225ac6565242b231129e0c4f8f0b7a041219cf
          path: cassandra-ccm
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up JDK 8
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: 8
          distribution: 'temurin'

      - name: Setup Python 3
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Put user-installed Python scripts on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache CCM install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local
            ~/.ccm/ccm-type
            ~/.ccm/ccm-version
          key: ccm-install-cassandra-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ccm-install-cassandra-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Pull Cassandra distribution from the cache
        id: cassandra-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccm/repository
          key: ccm-cassandra-${{ runner.os }}-${{ env.CASSANDRA_VERSION }}

      - name: Run integration tests on Cassandra, including SSL
        env:
          CCM_SSL_PATH: ${{ github.workspace }}/cassandra-ccm/ssl
        run: make test-integration-cassandra

      - name: Save Cassandra distribution into the cache
        if: steps.cassandra-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccm/repository
          key: ccm-cassandra-${{ runner.os }}-${{ env.CASSANDRA_VERSION }}
